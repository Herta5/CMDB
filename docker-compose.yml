# CMDB 从空库初始化；安全关键配置必须由部署环境显式提供。
name: cmdb
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cmdb
      MYSQL_USER: cmdb
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
    volumes:
      # 数据库使用独立持久卷，停止应用容器不会丢失业务数据。
      - cmdb-mysql-data:/var/lib/mysql
      - ./backend/migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./backend/migrations/002_cloud_resources.sql:/docker-entrypoint-initdb.d/002_cloud_resources.sql:ro
      - ./backend/migrations/003_async_sync_jobs.sql:/docker-entrypoint-initdb.d/003_async_sync_jobs.sql:ro
      - ./backend/migrations/004_remove_kubernetes.sql:/docker-entrypoint-initdb.d/004_remove_kubernetes.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "80"
      STATIC_DIR: /app/web
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: cmdb
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DB_NAME: cmdb
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      CMDB_ENCRYPTION_KEY: ${CMDB_ENCRYPTION_KEY:?请设置 CMDB_ENCRYPTION_KEY}
    ports:
      - "${CMDB_PORT:-80}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cmdb-mysql-data:
