# CMDB 从空库初始化；安全关键配置必须由部署环境显式提供。
name: cmdb
services:
  postgresql:
    image: postgres:17
    restart: unless-stopped
    ports:
      # 对外发布 PostgreSQL 端口，访问控制由宿主机防火墙和受限应用账号共同承担。
      - "5432:5432"
    environment:
      # PostgreSQL 管理员仅用于首次初始化，应用始终通过受限 cmdb 账号访问数据库。
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?请设置 POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: cmdb
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
    # 校验在官方入口执行 initdb 前完成，避免错误凭证留下不会自动重跑初始化脚本的数据卷。
    entrypoint: ["/bin/sh", "/usr/local/bin/cmdb-postgresql-entrypoint.sh"]
    volumes:
      # 数据库使用独立持久卷，停止应用容器不会丢失业务数据。
      - cmdb-postgresql-data:/var/lib/postgresql/data
      # 包装入口只负责 initdb 前的凭证校验，校验通过后仍由官方入口执行初始化流程。
      - ./backend/database/entrypoint/validate_before_init.sh:/usr/local/bin/cmdb-postgresql-entrypoint.sh:ro
      # 官方镜像按文件名顺序执行只读初始化文件，先创建受限应用账号再初始化业务结构。
      - ./backend/database/init/001_create_app_role.sh:/docker-entrypoint-initdb.d/001_create_app_role.sh:ro
      - ./backend/database/init/002_schema.sql:/docker-entrypoint-initdb.d/002_schema.sql:ro
    healthcheck:
      # 仅在 PostgreSQL 已接受 CMDB 数据库连接后允许应用启动。
      test: ["CMD-SHELL", "pg_isready -U postgres -d cmdb"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "80"
      STATIC_DIR: /app/web
      GIN_MODE: release
      DB_HOST: postgresql
      DB_PORT: "5432"
      DB_USER: cmdb
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DB_NAME: cmdb
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      CMDB_ENCRYPTION_KEY: ${CMDB_ENCRYPTION_KEY:?请设置 CMDB_ENCRYPTION_KEY}
    ports:
      - "${CMDB_PORT:-80}:80"
    depends_on:
      postgresql:
        condition: service_healthy

volumes:
  cmdb-postgresql-data:
