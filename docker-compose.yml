services:
  mysql:
    image: registry.aliyuncs.com/acheron/mysql:8.4
    container_name: cmdb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cmdb-root-2024
      MYSQL_DATABASE: cmdb
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/migrations/001_seed.sql:/docker-entrypoint-initdb.d/001_seed.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cmdb-app
    restart: unless-stopped
    environment:
      SERVER_PORT: "80"
      STATIC_DIR: /app/web
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: cmdb-root-2024
      DB_NAME: cmdb
      JWT_SECRET: cmdb-jwt-secret-change-in-production
    ports:
      - "80:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
