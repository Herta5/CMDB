# CMDB 第一阶段只初始化新版空库；安全关键配置必须由部署环境显式提供。
name: cmdb
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cmdb
      MYSQL_USER: cmdb
      MYSQL_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
    volumes:
      # 新卷名避免新版表结构与旧部署的数据混用；旧卷由操作者保留。
      - cmdb-foundation-mysql-data:/var/lib/mysql
      - ./backend/migrations/100_new_cmdb_schema.sql:/docker-entrypoint-initdb.d/100_new_cmdb_schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "80"
      STATIC_DIR: /app/web
      GIN_MODE: release
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: cmdb
      DB_PASSWORD: ${DB_PASSWORD:?请设置 DB_PASSWORD}
      DB_NAME: cmdb
      JWT_SECRET: ${JWT_SECRET:?请设置 JWT_SECRET}
      CMDB_ENCRYPTION_KEY: ${CMDB_ENCRYPTION_KEY:?请设置 CMDB_ENCRYPTION_KEY}
    ports:
      - "${CMDB_PORT:-8080}:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  cmdb-foundation-mysql-data:
