openapi: 3.0.3
info:
  title: CMDB 公开 HTTP 契约
  version: 1.0.0
  description: 公开传输结构唯一来源；授权、事务与生命周期业务语义见 docs/project。所有操作的错误均为安全中文，凭证仅用于请求。
security:
- bearerAuth: []
paths:
  /health:
    get:
      operationId: health
      summary: 检查进程存活
      tags:
      - CMDB
      responses:
        '500':
          description: 服务暂不可用
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '200':
          description: 操作成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      parameters: []
      security: []
  /api/v1/auth/login:
