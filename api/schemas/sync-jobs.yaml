SyncTypeStatistics:
  type: object
  additionalProperties: false
  properties:
    added:
      type: integer
      minimum: 0
    updated:
      type: integer
      minimum: 0
    restored:
      type: integer
      minimum: 0
    lost:
      type: integer
      minimum: 0
    deleted:
      type: integer
      minimum: 0
    failed:
      type: integer
      minimum: 0
  required:
  - added
  - updated
  - restored
  - lost
  - deleted
  - failed
SyncStatistics:
  type: object
  nullable: true
  additionalProperties:
    $ref: ../openapi.yaml#/components/schemas/SyncTypeStatistics
  description: 以资源类型为键；排队或整体失败时允许null或空对象。
SyncJob:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
      x-go-type: uint64
    project_id:
      type: integer
      format: int64
      minimum: 1
      x-go-type: uint64
    source_id:
      type: integer
      format: int64
      minimum: 1
      x-go-type: uint64
    previous_job_id:
      type: integer
      format: int64
      minimum: 1
      x-go-type: uint64
      nullable: true
    status:
      type: string
      enum:
      - queued
      - running
      - success
      - partial_success
      - failed
    trigger:
      type: string
      enum:
      - manual
      - scheduled
    statistics:
      $ref: ../openapi.yaml#/components/schemas/SyncStatistics
    error_summary:
      type: string
    started_at:
      type: string
      format: date-time
    finished_at:
      type: string
      format: date-time
      nullable: true
  required:
  - id
  - project_id
  - source_id
  - previous_job_id
  - status
  - trigger
  - statistics
  - error_summary
  - started_at
  - finished_at
SyncJobPage:
  type: object
  additionalProperties: false
  properties:
    items:
      type: array
      items:
        $ref: ../openapi.yaml#/components/schemas/SyncJob
      nullable: true
    total:
      type: integer
      format: int64
      minimum: 0
    page:
      type: integer
    page_size:
      type: integer
  required:
  - items
  - total
  - page
  - page_size
