ProjectRole:
  type: string
  enum:
  - project_admin
  - member
Project:
  type: object
  additionalProperties: false
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
      x-go-type: uint64
    code:
      type: string
    name:
      type: string
    description:
      type: string
    status:
      type: string
      enum:
      - enabled
      - disabled
    owner_username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
      nullable: true
    created_at:
      type: string
      format: date-time
    updated_at:
      type: string
      format: date-time
    current_role:
      $ref: ../openapi.yaml#/components/schemas/ProjectRole
  required:
  - id
  - code
  - name
  - description
  - status
  - owner_username
  - created_at
  - updated_at
CreateProjectRequest:
  type: object
  additionalProperties: false
  properties:
    code:
      type: string
      minLength: 1
    name:
      type: string
      minLength: 1
    description:
      type: string
      nullable: true
      x-go-type-skip-optional-pointer: true
    owner_username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
      nullable: true
  required:
  - code
  - name
UpdateProjectRequest:
  type: object
  additionalProperties: false
  properties:
    name:
      type: string
      minLength: 1
    description:
      type: string
      nullable: true
      x-go-type-skip-optional-pointer: true
    status:
      type: string
      enum:
      - enabled
      - disabled
    owner_username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
      nullable: true
    code:
      type: string
      nullable: true
      description: 兼容提交时忽略此字段，项目编码创建后不可修改。
      x-go-type-skip-optional-pointer: true
  required:
  - name
  - status
ProjectMember:
  type: object
  additionalProperties: false
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
    display_name:
      type: string
    role:
      $ref: ../openapi.yaml#/components/schemas/ProjectRole
  required:
  - username
  - display_name
  - role
MemberCandidate:
  type: object
  additionalProperties: false
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
    display_name:
      type: string
  required:
  - username
  - display_name
AddProjectMemberRequest:
  type: object
  additionalProperties: false
  properties:
    username:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_]+$
    role:
      $ref: ../openapi.yaml#/components/schemas/ProjectRole
  required:
  - username
  - role
UpdateProjectMemberRoleRequest:
  type: object
  additionalProperties: false
  properties:
    role:
      $ref: ../openapi.yaml#/components/schemas/ProjectRole
  required:
  - role
