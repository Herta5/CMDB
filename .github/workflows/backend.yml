name: 后端验证

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go 与 PostgreSQL 17 集成测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装项目指定 Go 版本
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: 执行统一后端验证入口
        run: ./scripts/test-backend.sh
